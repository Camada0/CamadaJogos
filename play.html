<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carregando Jogo...</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    .voltar {
      position: fixed; top: 12px; left: 12px; z-index: 9999;
      background: rgba(32, 32, 36, 0.85); color: #fff; text-decoration: none;
      padding: 8px 14px; border-radius: 6px; font: 600 13px system-ui, sans-serif;
      border: 1px solid #444; transition: opacity 0.3s;
    }
    .voltar:hover { background: #8257e5; }
  </style>
</head>
<body>

  <a href="index.html" class="voltar">← Voltar ao Menu</a>
  <div id="game"></div>

  <script>
    // Pega o ?id=... da URL
    const params = new URLSearchParams(window.location.search);
    const jogoId = params.get('id');

    fetch('jogos.json')
      .then(res => res.json())
      .then(jogos => {
        const jogo = jogos.find(j => j.id === jogoId);
        
        if (!jogo) {
          alert('Jogo não encontrado!');
          window.location.href = 'index.html';
          return;
        }

        document.title = jogo.titulo;

        // Configura o EmulatorJS dinamicamente
        window.EJS_player = "#game";
        window.EJS_core = jogo.core;
        window.EJS_gameUrl = jogo.rom;
        window.EJS_gameName = jogo.id;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

        // Injeta o script do emulador apenas depois de configurar as variáveis
        const script = document.createElement('script');
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
